services:
  - type: web
    name: f-o-withbreezeAPI
    runtime: python
    region: singapore     # change to your preferred region (e.g. oregon, frankfurt)
    plan: free            # change to starter/standard for production

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: APP_TOKEN
        sync: false          # secret — set manually in Render dashboard
      - key: BREEZE_API_KEY
        sync: false
      - key: BREEZE_API_SECRET
        sync: false
      - key: BREEZE_SESSION_TOKEN
        sync: false
